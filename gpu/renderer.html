*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#15251b;color:#e0eada;font:12px system-ui}#main,#c1{position:fixed;left:0;top:0;transform-origin:0 0}#btn{position:fixed;left:10px;top:10px;z-index:2}button{background:#29472e;color:#dce8ce;border:1px solid #71886a;border-radius:6px;min-height:40px;padding:8px 12px;cursor:pointer}#config{display:none;position:fixed;left:10px;top:60px;z-index:3;max-width:calc(100vw - 20px);padding:12px;background:#14241cf2;border:1px solid #597b4d;border-radius:8px}textarea{width:min(500px,calc(100vw - 48px));height:180px;background:#0d1a13;color:#dce8ce;border:1px solid #4d7042;font:12px/1.5 monospace}.metrics{position:fixed;bottom:10px;left:10px;right:10px;z-index:2;display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding:10px;background:#14241cdd;border-radius:8px;pointer-events:none}
