</style></head><body><header><a href="../" class="brand">DATXY.</a><a href="../">← 资源目录</a></header><main><div class="intro"><div><span class="kicker">THE WORKBENCH / 02</span><h1>GPU Test.</h1><p>用 WebGL 渲染测试显卡，观察帧率与运行稳定性。</p></div><div class="actions"><button id="start">开始测试 ↗</button><button id="stop" hidden>停止测试</button></div></div><div id="stage" class="stage"><div class="placeholder"><strong>◇</strong><p>准备就绪，点击「开始测试」运行。</p></div></div><p class="notice">测试会持续使用显卡，请留意设备温度；点击「停止测试」即可释放渲染页面。浏览器帧率不等同于专业硬件跑分。</p></main><script>
const start=document.getElementById('start'),stop=document.getElementById('stop'),stage=document.getElementById('stage');
start.addEventListener('click',()=>{const frame=document.createElement('iframe');frame.src='renderer.html';frame.title='WebGL 显卡渲染与帧率';stage.append(frame);start.disabled=true;stop.hidden=false;});
stop.addEventListener('click',()=>{stage.querySelector('iframe')?.remove();start.disabled=false;stop.hidden=true;start.focus();});
</script></body></html>
